<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BROADWAY Song Violin</title>
  <meta name="theme-color" content="#f7f3ec" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>BROADWAY Song Violin</h1>
    <div class="controls">
      <!-- Profile controls: select and simple actions -->
      <label style="margin-right:8px;">
        Profile:
        <select id="profile-select" title="Choose profile"></select>
      </label>
      <button id="btn-new-profile" class="small-btn">New Profile</button>
      <button id="btn-delete-profile" class="small-btn">Delete Profile</button>
      <button id="btn-clear-all" class="small-btn" style="display:none">Clear All</button>

      <!-- only add musical button kept -->
      <button id="btn-add-musical">+ Musical</button>
    </div>
  </header>

  <main class="container">
    <section class="overview">
      <h2>Overview</h2>
      <div id="overview-violin" class="violin-wrap"></div>
    </section>

    <section class="musicals" id="musicals-list">
      <!-- musical cards injected here -->
    </section>
  </main>

  <!-- modal placeholder (musical-only) -->
  <div id="modal" class="modal hidden">
    <div class="modal-inner">
      <button class="modal-close" id="modal-close">✕</button>
      <form id="modal-form">
        <h3 id="modal-title">Add Musical</h3>
        <div id="musical-fields">
          <label id="label-musical-name">Musical name: <input id="musical-name" required></label>
          <label id="label-musical-color">Color: <input id="musical-color" type="color" value="#ff7043"></label>

          <!-- catalog select inserted dynamically by JS when available -->

          <!-- paste musical JSON to create musical + songs in the shared catalog (Admin only) -->
          <label id="label-musical-json" style="margin-top:8px">Paste musical JSON (Admin only):<br>
            <textarea id="musical-json" rows="6" placeholder='{"type":"musical","musical":{...},"songs":[...]}'></textarea>
          </label>

          <label id="label-save-to-catalog" style="display:block;margin-top:6px">
            <input type="checkbox" id="save-to-catalog" checked> Save to catalog (Admin only)
          </label>

          <div id="catalog-empty-msg" style="color:#666;margin-top:6px;display:none">No catalog items available.</div>
        </div>
        <div class="modal-actions">
          <button type="submit" id="modal-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <small>Local-only PWA. Data saved in browser storage (no cloud).</small>
  </footer>

  <!-- app script -->
  <script src="app.js"></script>
</body>
</html>
