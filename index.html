<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BROADWAY Song Violin</title>
  <meta name="theme-color" content="#f7f3ec" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* layout tweaks for violin visibility and song-list scrolling */
    html, body { height: auto; min-height: 100%; }
    /* overview container should give plenty of vertical room */
    #overview-violin { min-height: 340px; margin-bottom: 12px; }
    /* per-musical violin smaller but tall enough to avoid clipping */
    .violin { min-height: 180px; }
    /* let song lists expand normally and let the page scroll (don't cap their height) */
    .song-list { max-height: none; overflow: visible; }
    /* catalog list stays scrollable but a bit taller for long lists */
    .catalog-list { max-height: 60vh; overflow:auto; border:1px solid rgba(0,0,0,0.06); padding:6px; border-radius:6px; background: #fff; }
    .catalog-item { padding:8px 10px; border-radius:6px; margin:4px 0; display:flex; align-items:center; gap:10px; cursor:pointer; }
    .catalog-item:hover, .catalog-item:focus { background: rgba(0,0,0,0.02); outline: none; }
    .catalog-dot { width:12px; height:12px; border-radius:3px; flex:0 0 12px; }
    .catalog-empty { color:#666; padding:8px; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>BROADWAY Song Violin</h1>
    <div class="controls">
      <label style="margin-right:8px;">
        Profile:
        <select id="profile-select" title="Choose profile"></select>
      </label>
      <button id="btn-new-profile" class="small-btn">New Profile</button>
      <button id="btn-delete-profile" class="small-btn">Delete Profile</button>
      <button id="btn-clear-all" class="small-btn" style="display:none">Clear All</button>
      <button id="btn-add-musical">+ Musical</button>
    </div>
  </header>

  <main class="container">
    <section class="overview">
      <h2>Overview</h2>
      <div id="overview-violin" class="violin-wrap"></div>
    </section>

    <section class="musicals" id="musicals-list">
    </section>
  </main>

  <!-- modal (musical-only) -->
  <div id="modal" class="modal hidden">
    <div class="modal-inner">
      <button class="modal-close" id="modal-close">✕</button>
      <form id="modal-form">
        <h3 id="modal-title">Add Musical</h3>
        <div id="musical-fields">
          <label id="label-musical-name">Musical name: <input id="musical-name" required></label>
          <label id="label-musical-color">Color: <input id="musical-color" type="color" value="#ff7043"></label>

          <!-- catalog list (scrollable) -->
          <div style="margin-top:8px">
            <div style="margin-bottom:6px;font-weight:600">Available musicals</div>
            <div id="catalog-list" class="catalog-list" aria-live="polite"></div>
          </div>

          <!-- paste musical JSON (Admin only) -->
          <label id="label-musical-json" style="margin-top:8px;display:block">Paste musical JSON (Admin only):<br>
            <textarea id="musical-json" rows="6" placeholder='{"type":"musical","musical":{...},"songs":[...]}' style="width:100%;box-sizing:border-box;font-family:monospace;font-size:0.9rem"></textarea>
          </label>

          <div id="catalog-empty-msg" style="color:#666;margin-top:6px;display:none">No catalog items available.</div>
        </div>

        <div class="modal-actions">
          <button type="submit" id="modal-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <!-- footer text removed -->
  </footer>

  <script src="app.js"></script>
</body>
</html>
